{% extends 'layouts/blank.html' %}

{% block content %}
<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <!-- Aumentei o max-w para 7xl e h-[95vh] -->
    <div class="bg-white rounded-lg shadow-xl w-full max-w-7xl h-[95vh] flex flex-col">
        <!-- Cabeçalho do modal -->
        <div class="flex justify-between items-center p-4 border-b">
            <h3 class="text-xl font-semibold">{{ document.title }}</h3>
            <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        
        <!-- Conteúdo do PDF - agora com mais espaço -->
        <div class="flex-grow">
            <iframe src="{{ pdf_url }}#toolbar=0&navpanes=0&scrollbar=0" 
                    class="w-full h-full border-0" 
                    frameborder="0">
            </iframe>
        </div>
        
        <!-- Rodapé do modal -->
        <div class="p-4 border-t flex justify-between items-center">
            <span class="text-sm text-gray-500">
                Documento protegido por senha
            </span>
            <button onclick="closeModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded">
                Fechar
            </button>
        </div>
    </div>
</div>

<script>
function closeModal() {
    window.parent.postMessage({ type: 'CLOSE_MODAL' }, '*');
}
</script>
{% endblock %}
