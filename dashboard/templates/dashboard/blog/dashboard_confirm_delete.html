{% extends 'dashboard/base.html' %}
{% block content %}
<div class="max-w-xl mx-auto mt-10 bg-white p-6 rounded shadow text-center">
    <h1 class="text-xl font-bold mb-4">Excluir Postagem</h1>
    <p>Tem certeza que deseja excluir a postagem <strong>{{ post.name }}</strong>?</p>
    <form method="post" class="mt-6">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded">Sim, excluir</button>
        <a href="{% url 'blog:dashboard_blog_list' %}" class="ml-4 text-gray-600">Cancelar</a>
    </form>
</div>
{% endblock %}
